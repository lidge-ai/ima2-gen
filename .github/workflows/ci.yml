name: CI

permissions:
  contents: read

on:
  push:
    branches: [main, dev, preview]
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      sha:
        description: 'Full 40-char SHA to check out and test (release candidate gate)'
        required: false
        type: string

concurrency:
  # Dispatched candidate runs share the release-candidate ref, so key the group
  # on the input SHA too — otherwise a second candidate cancels the first.
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event.inputs.sha || '' }}
  cancel-in-progress: true

jobs:
  # Which parts of the suite this event has to prove. Pushes diff the pushed
  # range on that branch through paths-filter, so a docs-only merge lands green
  # without paying for Windows/macOS runners. Schedule and dispatch runs always
  # request the full scope.
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ci: ${{ steps.scope.outputs.ci }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          ref: ${{ github.event.inputs.sha || github.sha }}
          fetch-depth: 0
      - name: Detect CI-relevant changes
        id: filter
        if: github.event_name == 'push'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          # On a branch push the action diffs the pushed range (before..head).
          # Without `base` it would compare against the default branch, so every
          # dev push would re-read the whole dev..main drift as changed.
          base: ${{ github.ref }}
          filters: |
            ci:
              - 'Dockerfile'
              - 'docker-compose.yml'
              - '.dockerignore'
              - '.gitattributes'
              - '.npmignore'
              - '.node-version'
              - 'flake.nix'
              - 'flake.lock'
              - 'package.json'
              - 'package-lock.json'
              - 'tsconfig*.json'
              - 'server.ts'
              - 'config.ts'
              - 'bin/**'
              - 'lib/**'
              - 'routes/**'
              - 'ui/**'
              - 'desktop/**'
              - 'tests/**'
              - 'scripts/**'
              - 'integrations/**'
              - 'skills/**'
              - 'presets/**'
              - 'public/**'
              - 'assets/**'
              - 'metrics/**'
              - 'nix/**'
              - 'vendor/**'
              - 'site/**'
              - 'structure/**'
              - 'devlog/**'
              - '.release/**'
              - '.codexclaw/**'
              - '.github/workflows/**'
              - '.github/actions/**'
              - '.github/scripts/**'
      - name: Resolve the requested scope
        id: scope
        # A missing or malformed filter output must fail this job instead of
        # silently making every expensive job skip. Non-push events always
        # request the full scope.
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            value="${{ steps.filter.outputs.ci }}"
          else
            value="true"
          fi
          case "$value" in
            true|false)
              printf 'ci=%s\n' "$value" >> "$GITHUB_OUTPUT"
              ;;
            *)
              printf '::error::changes scope was %q, expected true or false\n' "$value"
              exit 1
              ;;
          esac

  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }}, npm ${{ matrix.npm }})
    needs: changes
    if: github.event_name != 'push' || needs.changes.outputs.ci == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: '22.23.0'
            npm: '11.18.0'
          - os: ubuntu-latest
            node: '24.17.0'
            npm: '12.0.0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          ref: ${{ github.event.inputs.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          # npm's content-addressed cache is npm-version agnostic, so sharing it
          # across the npm 11/12 matrix legs on the same OS is intentional.
          cache: npm
          cache-dependency-path: |
            package-lock.json
            ui/package-lock.json
      - name: Assert candidate checkout
        env:
          EXPECTED_SHA: ${{ github.event.inputs.sha || github.sha }}
        run: node scripts/assert-ci-sha.mjs
      - name: Structure line-count drift (fast fail)
        run: node scripts/refresh-structure-line-counts.mjs --check
      - name: Pin npm
        run: npm install -g npm@${{ matrix.npm }}
      - name: Install root deps
        run: npm ci
      - name: Provider registry generated-file drift
        run: node scripts/generate-provider-types.mjs --check
      - name: Native dependency smoke
        run: npm run test:native-deps
      - name: Install ui deps
        run: npm --prefix ui ci --no-audit --no-fund
      - name: Install policy contract
        run: npm run test:install-policy
      - name: npm 12 pending-script oracle
        if: matrix.npm == '12.0.0'
        run: npm run test:install-policy:npm12
      - name: Typecheck
        run: npm run typecheck
      - name: Typecheck tests
        run: npm run typecheck:tests
      - name: Test inventory
        run: npm run test:inventory
      - name: Runtime installation documentation
        run: npm run docs:runtime:check
      - name: Build server (tsc emit)
        run: npm run build:server
      - name: Build cli (tsc emit)
        run: npm run build:cli
      - name: Build ui
        run: npm --prefix ui run build
      - name: Emitted doctor CLI offline and JSON contracts
        run: node --import tsx --input-type=module -e 'import { verifyEmittedDoctorCli } from "./tests/doctor-report.test.ts"; await verifyEmittedDoctorCli();'
      - name: Run tests
        run: npm test
        timeout-minutes: 20
      - name: Lint package.json
        if: matrix.os == 'ubuntu-latest' && matrix.npm == '11.18.0'
        run: npm run lint:pkg
      - name: Audit root production dependencies
        if: matrix.os == 'ubuntu-latest' && matrix.npm == '11.18.0'
        run: node scripts/audit-gate.mjs --audit-level high --omit dev
      - name: Audit UI build dependencies
        if: matrix.os == 'ubuntu-latest' && matrix.npm == '11.18.0'
        run: node scripts/audit-gate.mjs --prefix ui --audit-level high
      - name: Package install smoke
        run: npm run test:package-install
        timeout-minutes: 15
      - name: Global install, update, and package-local OAuth smoke
        run: npm run test:package-global-update
        timeout-minutes: 15
      - name: CLI smoke (grok status --json)
        run: node bin/ima2.js grok status --json
      - name: CLI smoke (video --help)
        run: node bin/ima2.js video --help
      - name: CLI smoke (capabilities)
        run: node bin/ima2.js capabilities --json
      - name: CLI smoke (--version)
        run: node bin/ima2.js --version
      - name: Graceful shutdown (SIGINT clean exit)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          node server.js &
          SERVER_PID=$!
          sleep 3
          kill -SIGINT $SERVER_PID 2>/dev/null || true
          TIMEOUT=10; while kill -0 $SERVER_PID 2>/dev/null && [ $TIMEOUT -gt 0 ]; do sleep 1; TIMEOUT=$((TIMEOUT-1)); done
          if kill -0 $SERVER_PID 2>/dev/null; then
            echo "::error::Server did not exit within 10s after SIGINT"
            kill -9 $SERVER_PID 2>/dev/null || true
            exit 1
          fi
          wait $SERVER_PID
          EXIT_CODE=$?
          echo "Server exited with code $EXIT_CODE"
          if [ $EXIT_CODE -ne 0 ]; then
            echo "::warning::Server exited with non-zero code $EXIT_CODE (may be signal-based exit)"
          fi
      - name: Verify install scripts in sync
        if: matrix.os == 'ubuntu-latest' && matrix.npm == '11.18.0'
        run: |
          diff scripts/install-mac.sh site/public/install-mac.sh
          diff scripts/install-linux.sh site/public/install-linux.sh
          diff scripts/install-windows.ps1 site/public/install-windows.ps1
      - name: Publish dry-run
        if: matrix.os == 'ubuntu-latest' && matrix.npm == '11.18.0'
        run: npm run publish:dry-run

  # Supported Windows installers are verified on the exact dispatched candidate,
  # on every main/dev/preview push (post-merge evidence), and nightly.
  # Candidate failures must be repaired before release.
  windows:
    name: windows (node ${{ matrix.node }}, npm ${{ matrix.npm }})
    needs: changes
    if: github.event_name != 'push' || needs.changes.outputs.ci == 'true'
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - node: '22.23.0'
            npm: '11.18.0'
          - node: '24.17.0'
            npm: '12.0.0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          ref: ${{ github.event.inputs.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            ui/package-lock.json
      - name: Assert candidate checkout
        env:
          EXPECTED_SHA: ${{ github.event.inputs.sha || github.sha }}
        run: node scripts/assert-ci-sha.mjs
      - name: Pin npm
        run: npm install -g npm@${{ matrix.npm }}
      - name: Install root deps
        run: npm ci --foreground-scripts
      - name: Native dependency smoke
        run: npm run test:native-deps
      - name: Install ui deps
        run: npm --prefix ui ci --no-audit --no-fund
      - name: Runtime installation documentation
        run: npm run docs:runtime:check
      - name: Typecheck
        run: npm run typecheck
      - name: Build server (tsc emit)
        run: npm run build:server
      - name: Build cli (tsc emit)
        run: npm run build:cli
      - name: Build ui
        run: npm --prefix ui run build
      - name: Hosted installer behavior
        run: node --import tsx --test tests/install-runtime-contract.test.ts
      - name: Run tests
        run: npm test
        timeout-minutes: 20
      - name: Package install smoke
        run: npm run test:package-install
        timeout-minutes: 15
      - name: CLI smoke (--version)
        run: node bin/ima2.js --version
      - name: CLI smoke (capabilities)
        run: node bin/ima2.js capabilities --json

  macos-install:
    name: macOS native installation
    needs: changes
    if: github.event_name != 'push' || needs.changes.outputs.ci == 'true'
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.17.0'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            ui/package-lock.json
      - name: Assert candidate checkout
        env:
          EXPECTED_SHA: ${{ github.event.inputs.sha || github.sha }}
        run: node scripts/assert-ci-sha.mjs
      - name: Pin npm
        run: npm install -g npm@11.18.0
      - name: Install root deps
        run: npm ci
      - name: Install ui deps
        run: npm --prefix ui ci --no-audit --no-fund
      - name: Native dependency smoke
        run: npm run test:native-deps
      - name: Runtime installation documentation
        run: npm run docs:runtime:check
      - name: Build server
        run: npm run build:server
      - name: Build cli
        run: npm run build:cli
      - name: Build ui
        run: npm --prefix ui run build
      - name: Hosted installer and offline doctor behavior
        run: node --import tsx --test tests/install-runtime-contract.test.ts tests/doctor-runtime.test.ts tests/doctor-report.test.ts
      - name: Package install smoke
        run: npm run test:package-install
        timeout-minutes: 15

  e2e:
    name: frontend e2e (ubuntu)
    needs: changes
    if: github.event_name != 'push' || needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    # The retained serial suite reached case253/258 at the former20-minute
    # job bound. Reserve time to finish and upload; individual test limits stay unchanged.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          ref: ${{ github.event.inputs.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify E2E source SHA
        env:
          WP07_EXPECTED_SHA: ${{ github.event.inputs.sha || github.sha }}
        run: |
          node --input-type=module -e '
            import { execFileSync } from "node:child_process";
            const wanted = process.env.WP07_EXPECTED_SHA;
            const actual = execFileSync("git", ["rev-parse", "HEAD"], { encoding: "utf8" }).trim();
            if (!/^[0-9a-f]{40}$/i.test(wanted ?? "") || wanted !== actual) {
              throw new Error("E2E checkout does not match the requested full SHA");
            }
          '
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.0'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            ui/package-lock.json
      - name: Install root deps
        run: npm ci
      - name: Install ui deps
        run: npm --prefix ui ci --no-audit --no-fund
      - name: Install Playwright Chromium
        run: npx --prefix ui playwright install --with-deps chromium
      - name: Build server
        run: npm run build:server
      - name: Build cli
        run: npm run build:cli
      - name: Typecheck E2E
        run: npm --prefix ui run typecheck:e2e
      - name: Build isolated fixture UI
        id: wp08_ui_build
        run: npm --prefix ui run build:fixture
      - name: Run frontend e2e
        env:
          WP08_BUILD_COMMAND: npm --prefix ui run build:fixture
          WP08_BUILD_OUTCOME: ${{ steps.wp08_ui_build.outcome }}
        run: npm --prefix ui run test:e2e -- --reporter=line
      - name: Upload WP09 isolation and journey evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wp09-journeys-${{ github.event.inputs.sha || github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          include-hidden-files: true
          path: |
            ui/test-results/**/wp09-*.png
            ui/test-results/**/wp09-*.json
            ui/test-results/**/wp12-*.png
            ui/test-results/**/wp12-*.json
            ui/dist/.ima2-ui-build-receipt.json
          if-no-files-found: error
          retention-days: 14
      - name: Upload composer evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wp08-composer-${{ github.event.inputs.sha || github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ui/test-results/**/wp08-*.png
            ui/test-results/**/wp08-*.json
          if-no-files-found: error
          retention-days: 7
      - name: Upload WP08c evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wp08c-provider-display-${{ github.event.inputs.sha || github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ui/test-results/**/wp08c-*.png
            ui/test-results/**/wp08c-*.json
          if-no-files-found: error
          retention-days: 14
      - name: Upload provider surface visual evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wp01-provider-surface-visual
          path: ui/test-results/**/wp01-*.png
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload selection evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wp02-selection-evidence
          path: |
            ui/test-results/**/wp02-*.png
            ui/test-results/**/wp02-*.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload execution error evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wp03-error-evidence
          path: |
            ui/test-results/**/wp03-*.png
            ui/test-results/**/wp03-*.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload e2e failure artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-failure-context
          path: ui/test-results/
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload job tracking evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wp07-job-tracking-evidence
          path: |
            ui/test-results/**/wp07-*.png
            ui/test-results/**/wp07-*.json
          if-no-files-found: error
          retention-days: 14

  # The post-merge gate this workflow exists to produce. It derives what the
  # event asked for from the same condition the scoped jobs carry, then requires
  # `success` from every requested job and `skipped` from every unrequested one —
  # both directions are checked, so a job that never started (or one that ran
  # when the gate did not expect it) fails here by name instead of passing over.
  ci:
    name: ci
    if: always()
    needs: [changes, test, windows, macos-install, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every requested job to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
          SCOPED: ${{ github.event_name != 'push' || needs.changes.outputs.ci == 'true' }}
        run: |
          node --input-type=module -e '
            const needs = JSON.parse(process.env.RESULTS);
            const scoped = process.env.SCOPED === "true";
            const failures = [];
            for (const [name, job] of Object.entries(needs)) {
              const expected = (name === "changes" || scoped) ? "success" : "skipped";
              if (job.result !== expected) failures.push(`${name}: ${job.result} (wanted ${expected})`);
            }
            if (failures.length) {
              console.error(failures.join("\n"));
              process.exit(1);
            }
          '
