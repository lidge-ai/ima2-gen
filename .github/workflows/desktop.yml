name: Desktop Build & Release

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Desktop platforms to build; only macOS is distributed today
        type: choice
        options: [mac, win, linux, all]
        default: mac
  push:
    tags:
      - 'desktop-v*'
  pull_request:
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'server.ts'
      - 'config.ts'
      - 'bin/**'
      - 'lib/**'
      - 'routes/**'
      - 'ui/**'
      - 'desktop/**'
      - '.github/workflows/desktop.yml'

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    name: Validate desktop build request
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.policy.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.17.0'
      - id: policy
        env:
          DESKTOP_EVENT: ${{ github.event_name }}
          DESKTOP_PLATFORM: ${{ inputs.platform || 'mac' }}
        run: node desktop/scripts/desktop-build-policy.mjs --matrix

  build:
    needs: prepare
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Cache must live outside the checkout: the root package.json is type=module,
      # which breaks electron-builder's CommonJS helper scripts if extracted under it.
      # (`runner` context is not available in job-level env, hence a step.)
      - name: Point electron-builder cache outside the checkout
        shell: bash
        run: |
          echo "ELECTRON_CACHE=${RUNNER_TEMP}/eb-cache/electron" >> "$GITHUB_ENV"
          echo "ELECTRON_BUILDER_CACHE=${RUNNER_TEMP}/eb-cache/electron-builder" >> "$GITHUB_ENV"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.17.0'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            ui/package-lock.json
            desktop/package-lock.json
      - uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ${{ runner.temp }}/eb-cache
          key: electron-${{ runner.os }}-${{ hashFiles('desktop/package-lock.json') }}
      - name: Pin npm
        run: npm install -g npm@11.18.0
      - name: Install root deps
        run: npm ci --no-audit --no-fund
      - name: Install ui deps
        run: npm --prefix ui ci --no-audit --no-fund
      - name: Install desktop deps
        run: npm --prefix desktop ci --no-audit --no-fund
      - name: Build server, CLI and UI
        run: npm --prefix desktop run prepare:app
      - name: Generate icons
        run: npm --prefix desktop run icons

      - name: Build unsigned macOS PR preview
        if: matrix.target == 'mac' && github.event_name == 'pull_request'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        # desktop/package.json dist:* scripts already pass --publish never. Repeating the flag
        # makes electron-builder's CLI receive ["never", "never"], which is not "never", so a
        # non-PR build then tries to upload to GitHub and fails without GH_TOKEN.
        run: npm --prefix desktop run dist:mac -- --config.forceCodeSigning=false --config.mac.notarize=false

      - name: Build signed and notarized macOS installers
        id: mac_build
        if: matrix.target == 'mac' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/desktop-v')))
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'true'
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          node desktop/scripts/desktop-build-policy.mjs --credentials
          npm --prefix desktop run dist:mac -- --config.forceCodeSigning=true --config.mac.type=distribution --config.mac.notarize=true

      - name: Verify every declared macOS architecture and exported installer
        id: mac_verify
        if: always() && matrix.target == 'mac' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/desktop-v'))) && steps.mac_build.outcome != 'skipped'
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          VERIFY_REQUIRE_STAPLED: '1'
        run: node desktop/scripts/verify-mac-artifacts.mjs --dist desktop/dist

      - name: Preserve macOS signing verification reports
        if: always() && matrix.target == 'mac' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/desktop-v'))) && steps.mac_verify.outcome != 'skipped'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ima2-macos-signature-proof
          if-no-files-found: error
          retention-days: 14
          path: desktop/dist/signature-proof/

      - name: Build (Windows)
        if: matrix.target == 'win'
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: npm --prefix desktop run dist:win

      - name: Build (Linux)
        if: matrix.target == 'linux'
        run: npm --prefix desktop run dist:linux

      - name: Smoke-check artifacts
        shell: bash
        run: ls -la desktop/dist | grep -Ev '\.(yml|yaml|blockmap)$|^total|builder-'

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ima2-desktop-${{ matrix.target }}
          if-no-files-found: error
          retention-days: 14
          path: |
            desktop/dist/*.dmg
            desktop/dist/*.zip
            desktop/dist/*.exe
            desktop/dist/*.AppImage
            desktop/dist/*.deb
            desktop/dist/*.blockmap
            desktop/dist/latest*.yml

  draft_release:
    name: Create verified draft release
    needs: [prepare, build]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/desktop-v')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      release_url: ${{ steps.draft.outputs.release_url }}
      checksums_sha256: ${{ steps.draft.outputs.checksums_sha256 }}
      notes_sha256: ${{ steps.draft.outputs.notes_sha256 }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate desktop release tag
        run: |
          VERSION=$(node -p "require('./package.json').version")
          EXPECTED_TAG="desktop-v${VERSION}"
          if [ "${GITHUB_REF_TYPE}" != "tag" ] || [ "${GITHUB_REF_NAME}" != "$EXPECTED_TAG" ]; then
            echo "Expected tag $EXPECTED_TAG, got ${GITHUB_REF_NAME:-<none>}" >&2
            exit 1
          fi
          echo "DESKTOP_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "DESKTOP_TAG=$EXPECTED_TAG" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ima2-desktop-mac
          path: desktop/dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ima2-macos-signature-proof
          path: desktop/dist/signature-proof
      - name: Validate and prepare desktop release assets
        run: >-
          node desktop/scripts/prepare-release-assets.mjs
          --dist desktop/dist
          --version "$DESKTOP_VERSION"
          --tag "$DESKTOP_TAG"
          --sha "$GITHUB_SHA"
      - name: Create or update draft release
        id: draft
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "$DESKTOP_TAG" --json isDraft --jq '.isDraft' > release-draft.txt 2>/dev/null; then
            if [ "$(cat release-draft.txt)" != "true" ]; then
              echo "Release $DESKTOP_TAG is already public; refusing to replace its assets." >&2
              exit 1
            fi
            gh release edit "$DESKTOP_TAG" \
              --verify-tag \
              --target "$GITHUB_SHA" \
              --title "ima2 Desktop ${DESKTOP_VERSION}" \
              --notes-file desktop/dist/RELEASE_NOTES.md \
              --draft
          else
            gh release create "$DESKTOP_TAG" \
              --verify-tag \
              --target "$GITHUB_SHA" \
              --title "ima2 Desktop ${DESKTOP_VERSION}" \
              --notes-file desktop/dist/RELEASE_NOTES.md \
              --draft
          fi
          gh release upload "$DESKTOP_TAG" \
            "desktop/dist/ima2-${DESKTOP_VERSION}-mac-arm64.dmg" \
            "desktop/dist/ima2-${DESKTOP_VERSION}-mac-arm64.zip" \
            "desktop/dist/ima2-${DESKTOP_VERSION}-mac-arm64.dmg.blockmap" \
            "desktop/dist/ima2-${DESKTOP_VERSION}-mac-arm64.zip.blockmap" \
            desktop/dist/latest-mac.yml \
            desktop/dist/SHA256SUMS.txt \
            --clobber
          gh release view "$DESKTOP_TAG" --json body --jq '.body' > release-body.md
          echo "checksums_sha256=$(sha256sum desktop/dist/SHA256SUMS.txt | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "notes_sha256=$(sha256sum release-body.md | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "release_url=$(gh release view "$DESKTOP_TAG" --json url --jq '.url')" >> "$GITHUB_OUTPUT"

  publish_release:
    name: Publish approved desktop release
    needs: draft_release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/desktop-v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: desktop-production
      url: ${{ needs.draft_release.outputs.release_url }}
    permissions:
      contents: write
    steps:
      - name: Require configured production approval gate
        env:
          DESKTOP_RELEASE_GATE: ${{ vars.DESKTOP_RELEASE_GATE }}
        shell: bash
        run: |
          if [ "$DESKTOP_RELEASE_GATE" != "required-reviewer-v1" ]; then
            echo "desktop-production is not configured with the required approval gate." >&2
            exit 1
          fi
      - name: Publish approved desktop release
        env:
          GH_TOKEN: ${{ github.token }}
          # This job has no checkout, so gh cannot infer the repository from a git remote.
          # Without GH_REPO the draft check prints nothing and publication is refused.
          GH_REPO: ${{ github.repository }}
          DESKTOP_TAG: ${{ github.ref_name }}
          EXPECTED_CHECKSUMS_SHA256: ${{ needs.draft_release.outputs.checksums_sha256 }}
          EXPECTED_NOTES_SHA256: ${{ needs.draft_release.outputs.notes_sha256 }}
        shell: bash
        run: |
          DESKTOP_VERSION="${DESKTOP_TAG#desktop-v}"
          if [ "$(gh release view "$DESKTOP_TAG" --json isDraft --jq '.isDraft')" != "true" ]; then
            echo "Release $DESKTOP_TAG is not a draft; refusing publication." >&2
            exit 1
          fi
          EXPECTED_ASSETS=$(printf '%s\n' \
            "ima2-${DESKTOP_VERSION}-mac-arm64.dmg" \
            "ima2-${DESKTOP_VERSION}-mac-arm64.zip" \
            "ima2-${DESKTOP_VERSION}-mac-arm64.dmg.blockmap" \
            "ima2-${DESKTOP_VERSION}-mac-arm64.zip.blockmap" \
            "latest-mac.yml" \
            "SHA256SUMS.txt" | sort)
          ACTUAL_ASSETS=$(gh release view "$DESKTOP_TAG" --json assets --jq '.assets[].name' | sort)
          if [ "$ACTUAL_ASSETS" != "$EXPECTED_ASSETS" ]; then
            echo "Draft release asset set does not match the Apple Silicon allowlist." >&2
            diff -u <(printf '%s\n' "$EXPECTED_ASSETS") <(printf '%s\n' "$ACTUAL_ASSETS") || true
            exit 1
          fi
          mkdir release-assets
          gh release download "$DESKTOP_TAG" --dir release-assets
          ACTUAL_CHECKSUMS_SHA256=$(sha256sum release-assets/SHA256SUMS.txt | awk '{print $1}')
          if [ "$ACTUAL_CHECKSUMS_SHA256" != "$EXPECTED_CHECKSUMS_SHA256" ]; then
            echo "SHA256SUMS.txt changed after the verified draft was created." >&2
            exit 1
          fi
          (cd release-assets && sha256sum --check SHA256SUMS.txt)
          gh release view "$DESKTOP_TAG" --json body --jq '.body' > release-assets/RELEASE_NOTES.md
          ACTUAL_NOTES_SHA256=$(sha256sum release-assets/RELEASE_NOTES.md | awk '{print $1}')
          if [ "$ACTUAL_NOTES_SHA256" != "$EXPECTED_NOTES_SHA256" ]; then
            echo "Release notes changed after the verified draft was created." >&2
            exit 1
          fi
          gh release edit "$DESKTOP_TAG" --draft=false --latest=false
