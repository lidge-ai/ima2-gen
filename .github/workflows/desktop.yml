name: Desktop Build

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Desktop platforms to build (publishing requires all)
        type: choice
        options: [all, mac, win, linux]
        default: all
      publish:
        description: Attach installers to the GitHub release matching desktop/package.json version
        type: boolean
        default: false
  push:
    tags:
      - 'desktop-v*'
  pull_request:
    paths:
      - 'desktop/**'
      - '.github/workflows/desktop.yml'

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    name: Validate desktop build request
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.policy.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.17.0'
      - id: policy
        env:
          DESKTOP_EVENT: ${{ github.event_name }}
          DESKTOP_PLATFORM: ${{ inputs.platform || 'all' }}
          DESKTOP_PUBLISH: ${{ inputs.publish || false }}
        run: node desktop/scripts/desktop-build-policy.mjs --matrix

  build:
    needs: prepare
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Cache must live outside the checkout: the root package.json is type=module,
      # which breaks electron-builder's CommonJS helper scripts if extracted under it.
      # (`runner` context is not available in job-level env, hence a step.)
      - name: Point electron-builder cache outside the checkout
        shell: bash
        run: |
          echo "ELECTRON_CACHE=${RUNNER_TEMP}/eb-cache/electron" >> "$GITHUB_ENV"
          echo "ELECTRON_BUILDER_CACHE=${RUNNER_TEMP}/eb-cache/electron-builder" >> "$GITHUB_ENV"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.17.0'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            ui/package-lock.json
            desktop/package-lock.json
      - uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ${{ runner.temp }}/eb-cache
          key: electron-${{ runner.os }}-${{ hashFiles('desktop/package-lock.json') }}
      - name: Pin npm
        run: npm install -g npm@11.18.0
      - name: Install root deps
        run: npm ci --no-audit --no-fund
      - name: Install ui deps
        run: npm --prefix ui ci --no-audit --no-fund
      - name: Install desktop deps
        run: npm --prefix desktop ci --no-audit --no-fund
      - name: Build server, CLI and UI
        run: npm --prefix desktop run prepare:app
      - name: Generate icons
        run: npm --prefix desktop run icons

      - name: Build unsigned macOS PR preview
        if: matrix.target == 'mac' && github.event_name == 'pull_request'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm --prefix desktop run dist:mac -- --config.forceCodeSigning=false --config.mac.notarize=false --publish never

      - name: Build signed and notarized macOS installers
        id: mac_build
        if: matrix.target == 'mac' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/desktop-v')))
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'true'
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          node desktop/scripts/desktop-build-policy.mjs --credentials
          npm --prefix desktop run dist:mac -- --config.forceCodeSigning=true --config.mac.type=distribution --config.mac.notarize=true --publish never

      - name: Verify both macOS architectures and exported installers
        id: mac_verify
        if: always() && matrix.target == 'mac' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/desktop-v'))) && steps.mac_build.outcome != 'skipped'
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          VERIFY_REQUIRE_STAPLED: '1'
        run: node desktop/scripts/verify-mac-artifacts.mjs --dist desktop/dist

      - name: Preserve macOS signing verification reports
        if: always() && matrix.target == 'mac' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/desktop-v'))) && steps.mac_verify.outcome != 'skipped'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ima2-macos-signature-proof
          if-no-files-found: error
          retention-days: 14
          path: desktop/dist/signature-proof/

      - name: Build (Windows)
        if: matrix.target == 'win'
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: npm --prefix desktop run dist:win

      - name: Build (Linux)
        if: matrix.target == 'linux'
        run: npm --prefix desktop run dist:linux

      - name: Smoke-check artifacts
        shell: bash
        run: ls -la desktop/dist | grep -Ev '\.(yml|yaml|blockmap)$|^total|builder-'

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ima2-desktop-${{ matrix.target }}
          if-no-files-found: error
          retention-days: 14
          path: |
            desktop/dist/*.dmg
            desktop/dist/*.zip
            desktop/dist/*.exe
            desktop/dist/*.AppImage
            desktop/dist/*.deb
            desktop/dist/*.blockmap
            desktop/dist/latest*.yml

  release:
    name: Attach to GitHub release
    needs: [prepare, build]
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/desktop-v')) || (github.event_name == 'workflow_dispatch' && github.event.inputs.publish == 'true' && (github.event.inputs.platform || 'all') == 'all')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: ima2-desktop-*
          merge-multiple: true
          path: desktop/dist
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./desktop/package.json').version")
          TAG="desktop-v${VERSION}"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "ima2 Desktop ${VERSION}" --notes "Electron desktop builds for ima2-gen." --draft
          gh release upload "$TAG" desktop/dist/*.dmg desktop/dist/*.zip desktop/dist/*.exe desktop/dist/*.AppImage desktop/dist/*.deb desktop/dist/latest*.yml --clobber
