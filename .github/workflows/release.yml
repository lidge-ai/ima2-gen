name: Release

# Replaces scripts/release.sh. The cut runs here end to end:
#   baseline -> version commit -> main -> preview -> preview publish proof
#   -> stable tag (main+dev+tag atomically) -> stable publish
#
# publish.yml still owns publishing and stays the only holder of id-token: write. It is
# reached by workflow_dispatch rather than by the pushes below, because a GITHUB_TOKEN
# push emits no workflow event — without that dispatch a CI-minted tag would strand an
# unpublished version, the exact failure release.sh:99 warned about.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Semver bump for the release'
        required: true
        default: patch
        type: choice
        options: [patch, minor, major]
      dry_run:
        description: 'true: verify only, no remote change; canary: also exercise the candidate CI gate; false: real release'
        required: true
        default: 'true'
        type: choice
        options: ['true', 'canary', 'false']
      expected_sha:
        description: 'Optional full SHA the caller decided on; the cut refuses to start if origin/main moved past it'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  cut:
    name: Cut the version commit and prove the preview build
    runs-on: ubuntu-latest
    # Envelopes candidate verification (45), candidate CI (45), preview publish
    # wait (100), and setup/cleanup margin. Child gates retain shorter deadlines.
    timeout-minutes: 240
    permissions:
      contents: write
      actions: write
    outputs:
      version: ${{ steps.commit.outputs.version }}
      sha: ${{ steps.commit.outputs.sha }}
      dry_run: ${{ inputs.dry_run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          fetch-depth: 0
          ref: main
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.node-version'
          registry-url: 'https://registry.npmjs.org'
      - name: Pin release npm
        run: |
          NPM_VERSION=$(node -p "require('./package.json').packageManager.split('@').pop()")
          npm install -g "npm@$NPM_VERSION"
          test "$(npm -v)" = "$NPM_VERSION"
      - name: Fetch release branches and tags
        run: git fetch origin main dev preview --tags
      - name: Assert the release baseline
        run: node scripts/release-cut.mjs preflight
      - name: Refuse to cut from a moved baseline
        if: ${{ inputs.expected_sha != '' }}
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          ACTUAL=$(git rev-parse origin/main)
          if [ "$EXPECTED_SHA" != "$ACTUAL" ]; then
            echo "expected_sha $EXPECTED_SHA but origin/main is $ACTUAL"
            exit 1
          fi
      - name: Assert the pinned release toolchain
        run: node scripts/release-contract.mjs assert-toolchain
      - run: npm ci
      - run: npm --prefix ui ci --no-audit --no-fund
      - id: commit
        name: Create the version commit
        env:
          BUMP: ${{ inputs.bump }}
        run: node scripts/release-cut.mjs commit "$BUMP"
      # release.sh verified BEFORE promoting anything. publish.yml runs the same gate, but
      # only after the push — by then a bad commit is already on main. Verify first so a
      # failing release leaves the remote untouched.
      - name: Verify the release candidate before promoting it
        run: npm run verify:release
        timeout-minutes: 45
      - name: Refuse a candidate whose verification changed tracked output
        run: node scripts/release-cut.mjs assert-clean
      # D2: a version-only commit (package.json + lockfile bump) adds no code
      # delta, so the parent commit's main push CI already proves this tree.
      # Only then is reusing that run even considered.
      - id: versiononly
        name: Check that the version commit only changes version files
        run: >-
          node scripts/release-cut.mjs version-only
          "$(git rev-parse ${{ steps.commit.outputs.sha }}^)"
          "${{ steps.commit.outputs.sha }}"
      - id: reuse
        name: Reuse the main push CI for the parent commit
        # Canary must still exercise the candidate CI gate end to end, so the
        # reuse path stays off in canary mode even for version-only bumps.
        if: ${{ inputs.dry_run != 'canary' && steps.versiononly.outputs.version_only == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        # 30, not 45: a fallback after a full wait still has to fit the candidate
        # CI (45) and the preview wait (100) inside the cut job's 240 minutes.
        run: node scripts/wait-ci-gate.mjs reuse-push "$(git rev-parse ${{ steps.commit.outputs.sha }}^)" 30
        timeout-minutes: 35
      # Exact-SHA CI gate (roadmap 030): the candidate must exist on the remote
      # before CI can check it out, but main/preview must not move before the gate
      # passes — so the candidate rides a dedicated ref that nothing else reads.
      - name: Publish the candidate to its own ref
        if: ${{ inputs.dry_run != 'true' && steps.reuse.outputs.reusable != 'true' }}
        env:
          CANDIDATE_SHA: ${{ steps.commit.outputs.sha }}
        run: |
          OLD=$(git ls-remote origin refs/heads/release-candidate | cut -f1)
          git push --force-with-lease="refs/heads/release-candidate:${OLD:-}" origin \
            "$CANDIDATE_SHA:refs/heads/release-candidate"
      - id: ci_mark
        name: Record the CI run high-water mark
        if: ${{ inputs.dry_run != 'true' && steps.reuse.outputs.reusable != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "id=$(node scripts/wait-ci-gate.mjs latest-id)" >> "$GITHUB_OUTPUT"
      - name: Dispatch CI for the exact candidate SHA
        if: ${{ inputs.dry_run != 'true' && steps.reuse.outputs.reusable != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh workflow run ci.yml --ref release-candidate
          -f sha=${{ steps.commit.outputs.sha }}
      - name: Wait for the candidate CI gate
        if: ${{ inputs.dry_run != 'true' && steps.reuse.outputs.reusable != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          node scripts/wait-ci-gate.mjs wait
          "${{ steps.ci_mark.outputs.id }}"
          "${{ steps.commit.outputs.sha }}"
          45
      - name: Clean up the candidate ref
        if: ${{ always() && inputs.dry_run != 'true' && steps.reuse.outputs.reusable != 'true' }}
        env:
          CANDIDATE_SHA: ${{ steps.commit.outputs.sha }}
        run: |
          CURRENT=$(git ls-remote origin refs/heads/release-candidate | cut -f1)
          # Ownership lease: delete only the ref this run pushed, never one
          # somebody else replaced it with.
          if [ -n "$CANDIDATE_SHA" ] && [ "$CURRENT" = "$CANDIDATE_SHA" ]; then
            git push origin :refs/heads/release-candidate
          fi
      - name: Push the version commit to main
        if: ${{ inputs.dry_run == 'false' }}
        run: git push origin "HEAD:refs/heads/main"
      - name: Promote the exact SHA to preview
        if: ${{ inputs.dry_run == 'false' }}
        run: git push origin "${{ steps.commit.outputs.sha }}:refs/heads/preview"
      - id: preview_mark
        name: Record the publish run high-water mark
        if: ${{ inputs.dry_run == 'false' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "id=$(node scripts/wait-publish-run.mjs latest-id)" >> "$GITHUB_OUTPUT"
      - name: Publish the preview candidate
        if: ${{ inputs.dry_run == 'false' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run publish.yml \
            -f publish_ref=refs/heads/preview \
            -f publish_sha=${{ steps.commit.outputs.sha }}
      - name: Wait for the preview publish to finish
        if: ${{ inputs.dry_run == 'false' }}
        env:
          GH_TOKEN: ${{ github.token }}
        # package source gate (25) + Windows consumer (40) + publish margin.
        run: node scripts/wait-publish-run.mjs wait "${{ steps.preview_mark.outputs.id }}" "preview@${{ steps.commit.outputs.sha }}" 100
      - name: Require the npm preview proof before tagging
        if: ${{ inputs.dry_run == 'false' }}
        run: >-
          node scripts/release-cut.mjs assert-preview-proof
          "${{ steps.commit.outputs.version }}"
          "${{ steps.commit.outputs.sha }}"

  tag:
    name: Mint the stable tag and publish
    needs: cut
    # == 'false', not != 'true': canary must never tag, push main/dev, or
    # dispatch the stable publish (roadmap 030 audit blocker).
    if: needs.cut.outputs.dry_run == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # The approval gate sits here, before the atomic push, not on the stable
    # publish job downstream. GitHub holds an environment-gated job before its
    # first step, so a declined or ignored approval leaves main, dev, and the
    # tag exactly where they were. Gating the publish instead would let the
    # push land and then strand the release with npm still on the old version.
    environment:
      name: npm-stable
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          fetch-depth: 0
          ref: ${{ needs.cut.outputs.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.node-version'
          registry-url: 'https://registry.npmjs.org'
      - name: Fetch release branches and tags
        run: git fetch origin main dev preview --tags
      - name: Refuse to tag if the remotes moved during preview verification
        run: node scripts/release-cut.mjs assert-remotes-unmoved "${{ needs.cut.outputs.sha }}"
      - name: Re-check the preview proof at tag time
        run: >-
          node scripts/release-cut.mjs assert-preview-proof
          "${{ needs.cut.outputs.version }}"
          "${{ needs.cut.outputs.sha }}"
      - name: Create and atomically push main, dev, and the tag
        env:
          VERSION: ${{ needs.cut.outputs.version }}
          SHA: ${{ needs.cut.outputs.sha }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "v$VERSION" "$SHA"
          git push --atomic origin \
            "$SHA:refs/heads/main" \
            "$SHA:refs/heads/dev" \
            "refs/tags/v$VERSION:refs/tags/v$VERSION"
      # D4: desktop assets build in parallel with the npm stable publish, so
      # the tag job starts them instead of a hand-pushed tag after the fact.
      # A pre-existing desktop-v tag must resolve to this SHA or the job
      # fails: dispatching on an unverified tag could ship binaries for the
      # wrong commit.
      - name: Push the desktop release tag
        env:
          VERSION: ${{ needs.cut.outputs.version }}
          SHA: ${{ needs.cut.outputs.sha }}
        run: |
          git fetch origin --tags
          if git rev-parse -q --verify "refs/tags/desktop-v$VERSION" >/dev/null; then
            EXISTING=$(git rev-parse "refs/tags/desktop-v$VERSION^{commit}")
            if [ "$EXISTING" != "$SHA" ]; then
              echo "refs/tags/desktop-v$VERSION already exists at $EXISTING, expected the release SHA $SHA"
              exit 1
            fi
          else
            git push origin "$SHA:refs/tags/desktop-v$VERSION"
          fi
      - name: Start the desktop release build
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "re-dispatch desktop: gh workflow run desktop.yml --ref desktop-v${{ needs.cut.outputs.version }} -f platform=all"
          gh workflow run desktop.yml \
            --ref "desktop-v${{ needs.cut.outputs.version }}" \
            -f platform=all
      - id: stable_mark
        name: Record the publish run high-water mark
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "id=$(node scripts/wait-publish-run.mjs latest-id)" >> "$GITHUB_OUTPUT"
      - name: Publish the stable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run publish.yml \
            -f publish_ref="refs/tags/v${{ needs.cut.outputs.version }}" \
            -f publish_sha=${{ needs.cut.outputs.sha }}
      - name: Wait for the stable publish to finish
        env:
          GH_TOKEN: ${{ github.token }}
        # 80, not the 60-minute default: publish.yml's stable job is also
        # environment-gated, so this wait now covers a second approval. The
        # job timeout above is the real ceiling.
        run: node scripts/wait-publish-run.mjs wait "${{ steps.stable_mark.outputs.id }}" "v${{ needs.cut.outputs.version }}" 80
      - name: Write the release summary
        run: |
          {
            echo "### Release v${{ needs.cut.outputs.version }}"
            echo "- sha: ${{ needs.cut.outputs.sha }}"
            echo "- main, dev, preview, and the tag all point at that commit"
            echo "- npm preview and latest were published by publish.yml"
            echo "- desktop build: desktop.yml dispatched on refs/tags/desktop-v${{ needs.cut.outputs.version }}"
            echo "- re-dispatch desktop: gh workflow run desktop.yml --ref desktop-v${{ needs.cut.outputs.version }} -f platform=all"
            echo "- re-dispatch pages: gh workflow run pages.yml --ref main -f release_sha=${{ needs.cut.outputs.sha }} -f release_version=${{ needs.cut.outputs.version }}"
          } >> "$GITHUB_STEP_SUMMARY"
      # D5: the Pages site rebuilds from the release inputs once npm stable
      # has landed. Failure here must not fail the release, so the dispatch
      # tolerates errors and the summary above carries the re-dispatch command.
      - name: Deploy the Pages site for this release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "re-dispatch pages: gh workflow run pages.yml --ref main -f release_sha=${{ needs.cut.outputs.sha }} -f release_version=${{ needs.cut.outputs.version }}"
          gh workflow run pages.yml \
            --ref main \
            -f release_sha=${{ needs.cut.outputs.sha }} \
            -f release_version=${{ needs.cut.outputs.version }}
