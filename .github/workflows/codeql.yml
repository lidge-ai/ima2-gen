name: CodeQL

on:
  workflow_dispatch:
    inputs:
      sha:
        description: 'Exact 40-character commit SHA to analyze'
        required: false
        type: string
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze JavaScript/TypeScript
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          ref: ${{ github.event.inputs.sha || github.sha }}
          fetch-depth: 0
      - name: Assert requested analysis commit
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.sha != '' }}
        shell: bash
        env:
          EXPECTED_ANALYSIS_SHA: ${{ github.event.inputs.sha }}
        run: |
          [[ "$EXPECTED_ANALYSIS_SHA" =~ ^[a-f0-9]{40}$ ]] || exit 1
          test "$(git rev-parse HEAD)" = "$EXPECTED_ANALYSIS_SHA"
      - name: Initialize CodeQL
        uses: github/codeql-action/init@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          languages: javascript-typescript
          build-mode: none
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          category: "/language:javascript-typescript"
