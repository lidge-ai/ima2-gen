name: Publish to npm

on:
  push:
    branches: [preview]
    tags: ['v*']
  # release.yml re-triggers this after its own pushes. A GITHUB_TOKEN push emits no push
  # event, so without a dispatch path a CI-minted tag would strand an unpublished version
  # (the exact state the old release.sh warned about). The ref is still classified by
  # scripts/release-contract.mjs, which accepts only refs/heads/preview or a v* tag whose
  # name matches package.json — a dispatch cannot widen what may be published.
  workflow_dispatch:
    inputs:
      publish_ref:
        description: 'refs/heads/preview or refs/tags/vX.Y.Z'
        required: true
        type: string
      publish_sha:
        description: 'Commit the ref must point at'
        required: true
        type: string

permissions:
  contents: read

# One canonical ref/sha for the whole workflow. A push classifies its own event; a
# dispatch from release.yml names the ref explicitly because the dispatch itself runs
# on the default branch. scripts/release-contract.mjs still validates whatever lands here.
env:
  PUBLISH_REF: ${{ inputs.publish_ref || github.ref }}
  PUBLISH_SHA: ${{ inputs.publish_sha || github.sha }}


concurrency:
  # A dispatch runs on the default branch, so keying on github.ref alone would put a
  # preview run and a stable run in one group. Key on the ref actually being published.
  group: publish-${{ inputs.publish_ref || github.ref }}
  cancel-in-progress: ${{ (inputs.publish_ref || github.ref) == 'refs/heads/preview' }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      should_publish: ${{ steps.plan.outputs.should_publish }}
      should_verify: ${{ steps.plan.outputs.should_verify }}
      channel: ${{ steps.plan.outputs.channel }}
      npm_tag: ${{ steps.plan.outputs.npm_tag }}
      version: ${{ steps.plan.outputs.version }}
      source_ref: ${{ steps.plan.outputs.source_ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.publish_sha || github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.node-version'
          registry-url: 'https://registry.npmjs.org'
      - name: Pin release npm
        run: |
          NPM_VERSION=$(node -p "require('./package.json').packageManager.split('@').pop()")
          npm install -g "npm@$NPM_VERSION"
          echo "node=$(node -v) npm=$(npm -v)"
      - name: Fetch release branches and tags
        run: git fetch origin main dev preview --tags
      - id: plan
        name: Classify trusted publish event
        run: node scripts/release-contract.mjs prepare

  package:
    needs: prepare
    if: needs.prepare.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.publish_sha || github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.node-version'
          registry-url: 'https://registry.npmjs.org'
      - name: Pin release npm
        run: |
          NPM_VERSION=$(node -p "require('./package.json').packageManager.split('@').pop()")
          npm install -g "npm@$NPM_VERSION"
          test "$(npm -v)" = "$NPM_VERSION"
      - name: Prove package job has no OIDC token
        run: test -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}"
      - run: npm ci
      - run: npm run test:native-deps
      - run: npm --prefix ui ci --no-audit --no-fund
      - name: Set preview package version
        if: needs.prepare.outputs.channel == 'preview'
        run: npm version "${{ needs.prepare.outputs.version }}" --no-git-tag-version
      - run: npm run verify:release:source
        timeout-minutes: 25
      - id: artifact
        name: Pack release artifact once
        run: node scripts/release-contract.mjs pack "$RUNNER_TEMP/npm-release"
      - name: Install-smoke the exact release artifact
        run: npm run test:package-install
        env:
          IMA2_PACKAGE_TARBALL: ${{ steps.artifact.outputs.tarball }}
      - name: Upload tested package, manifest, and SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-release-artifact
          path: ${{ runner.temp }}/npm-release/
          if-no-files-found: error
          retention-days: 90

  verify-existing:
    needs: prepare
    if: needs.prepare.outputs.should_verify == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.publish_sha || github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.node-version'
          registry-url: 'https://registry.npmjs.org'
      - name: Pin release npm
        run: |
          NPM_VERSION=$(node -p "require('./package.json').packageManager.split('@').pop()")
          npm install -g "npm@$NPM_VERSION"
          test "$(npm -v)" = "$NPM_VERSION"
      - name: Verify immutable registry package and signed provenance
        run: >-
          node scripts/release-contract.mjs verify-channel
          "${{ needs.prepare.outputs.version }}"
          "${{ needs.prepare.outputs.npm_tag }}"
          "${{ needs.prepare.outputs.source_ref }}"
          "$PUBLISH_SHA"
      - name: Create or refresh GitHub Release for already-published latest
        if: needs.prepare.outputs.channel == 'latest'
        run: >-
          node scripts/release-contract.mjs ensure-github-release
          "${{ needs.prepare.outputs.version }}"
          "$PUBLISH_SHA"

  windows-consumer:
    needs: [prepare, package]
    # Preview lane only (260819 release-speed unit). The stable tag can only
    # exist after release.yml's preview proof, and prepare re-verifies that
    # proof for the latest channel: the same gitHead already passed this
    # matrix minutes earlier on the preview lane. Re-running it doubled the
    # release wall time for zero new evidence (opencodex pattern: a verified
    # SHA is not re-verified).
    if: needs.prepare.outputs.should_publish == 'true' && needs.prepare.outputs.channel == 'preview'
    runs-on: windows-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - node: '22.23.0'
            npm: '11.18.0'
          - node: '24.17.0'
            npm: '12.0.0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.publish_sha || github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          registry-url: 'https://registry.npmjs.org'
      - name: Subprocess deadline tree-kill contract (no npm ci; builtins only)
        run: node --test tests/subprocess-deadline-contract.test.ts
      - name: Pin npm
        run: npm install -g npm@${{ matrix.npm }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-release-artifact
          path: release-artifact
      - name: Verify tested artifact digest
        run: node scripts/release-contract.mjs verify-artifact release-artifact/release-manifest.json
      - name: Update a real global install and probe package-local OAuth
        shell: pwsh
        run: |
          $manifest = Get-Content release-artifact/release-manifest.json | ConvertFrom-Json
          $env:IMA2_PACKAGE_TARBALL = Join-Path $PWD "release-artifact/$($manifest.filename)"
          npm run test:package-global-update
        # The smoke owns labeled 1-7 minute child deadlines. Keep this wrapper
        # outside their full prepacked sequence so it never hides the culprit.
        timeout-minutes: 40

  publish-preview:
    needs: [prepare, package, windows-consumer]
    if: needs.prepare.outputs.should_publish == 'true' && needs.prepare.outputs.channel == 'preview'
    runs-on: ubuntu-latest
    # Auto-approved: this lane can only ever move the preview dist-tag, which
    # every cut overwrites anyway.
    environment:
      name: npm-preview
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.publish_sha || github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.node-version'
          registry-url: 'https://registry.npmjs.org'
      - name: Pin release npm
        run: |
          NPM_VERSION=$(node -p "require('./package.json').packageManager.split('@').pop()")
          npm install -g "npm@$NPM_VERSION"
          test "$(npm -v)" = "$NPM_VERSION"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-release-artifact
          path: release-artifact
      - name: Verify tested artifact digest
        run: node scripts/release-contract.mjs verify-artifact release-artifact/release-manifest.json
      - name: Verify OIDC endpoint
        run: |
          test -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}"
          echo "OIDC endpoint is available to the preview publish job"
      - name: Recheck live release refs
        run: node scripts/release-contract.mjs assert-remote-ref "$PUBLISH_REF" "$PUBLISH_SHA"
      - id: registry
        name: Guard immutable registry version
        run: >-
          node scripts/release-contract.mjs guard-publish
          release-artifact/release-manifest.json
          "${{ needs.prepare.outputs.npm_tag }}"
          "${{ needs.prepare.outputs.source_ref }}"
          "$PUBLISH_SHA"
      - name: Publish tested tarball
        if: steps.registry.outputs.should_publish == 'true'
        run: |
          TARBALL=$(node -p "'./release-artifact/' + require('./release-artifact/release-manifest.json').filename")
          npm publish "$TARBALL" --ignore-scripts --tag "${{ needs.prepare.outputs.npm_tag }}" --provenance --access public
      - name: Verify registry, dist-tag, integrity, and provenance
        # verifyRegistryEventually waits up to 15 min (20 min override) for npm's async processing,
        # plus one worst-case attempt (REGISTRY_PROOF_ATTEMPT_BUDGET_MS) after the last check.
        timeout-minutes: 26
        run: >-
          node scripts/release-contract.mjs verify-registry
          release-artifact/release-manifest.json
          "${{ needs.prepare.outputs.npm_tag }}"
          "${{ needs.prepare.outputs.source_ref }}"
          "$PUBLISH_SHA"
        env:
          IMA2_EXPECT_CURRENT_PROVENANCE: ${{ steps.registry.outputs.should_publish }}
      - name: Write release proof summary
        run: |
          VERSION=$(node -p "require('./release-artifact/release-manifest.json').version")
          INTEGRITY=$(node -p "require('./release-artifact/release-manifest.json').integrity")
          {
            echo "### npm publish proof"
            echo "- channel: ${{ needs.prepare.outputs.channel }}"
            echo "- version: $VERSION"
            echo "- source: $PUBLISH_REF@$PUBLISH_SHA"
            echo "- integrity: $INTEGRITY"
            echo "- workflow: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } >> "$GITHUB_STEP_SUMMARY"

  publish-stable:
    needs: [prepare, package, windows-consumer]
    # windows-consumer is deliberately skipped on this channel, so success()
    # must be replaced: !failure() && !cancelled() accepts a skipped need but
    # still refuses to run after a failed package job. An unconditional
    # override is forbidden here — it would publish over a failure.
    if: ${{ !failure() && !cancelled() && needs.prepare.outputs.should_publish == 'true' && needs.prepare.outputs.channel == 'latest' }}
    runs-on: ubuntu-latest
    # release.yml gates its tag job on this same environment, so a release cut
    # is already approved before it reaches here. This gate exists to cover the
    # other way in: a v* tag pushed by hand.
    environment:
      name: npm-stable
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.publish_sha || github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.node-version'
          registry-url: 'https://registry.npmjs.org'
      - name: Pin release npm
        run: |
          NPM_VERSION=$(node -p "require('./package.json').packageManager.split('@').pop()")
          npm install -g "npm@$NPM_VERSION"
          test "$(npm -v)" = "$NPM_VERSION"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-release-artifact
          path: release-artifact
      - name: Verify tested artifact digest
        run: node scripts/release-contract.mjs verify-artifact release-artifact/release-manifest.json
      - name: Verify OIDC endpoint
        run: |
          test -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}"
          echo "OIDC endpoint is available to the stable publish job"
      - name: Recheck live release refs
        run: node scripts/release-contract.mjs assert-remote-ref "$PUBLISH_REF" "$PUBLISH_SHA"
      - id: registry
        name: Guard immutable registry version
        run: >-
          node scripts/release-contract.mjs guard-publish
          release-artifact/release-manifest.json
          "${{ needs.prepare.outputs.npm_tag }}"
          "${{ needs.prepare.outputs.source_ref }}"
          "$PUBLISH_SHA"
      - name: Publish tested tarball
        if: steps.registry.outputs.should_publish == 'true'
        run: |
          TARBALL=$(node -p "'./release-artifact/' + require('./release-artifact/release-manifest.json').filename")
          npm publish "$TARBALL" --ignore-scripts --tag "${{ needs.prepare.outputs.npm_tag }}" --provenance --access public
      - name: Verify registry, dist-tag, integrity, and provenance
        timeout-minutes: 26
        run: >-
          node scripts/release-contract.mjs verify-registry
          release-artifact/release-manifest.json
          "${{ needs.prepare.outputs.npm_tag }}"
          "${{ needs.prepare.outputs.source_ref }}"
          "$PUBLISH_SHA"
        env:
          IMA2_EXPECT_CURRENT_PROVENANCE: ${{ steps.registry.outputs.should_publish }}
      - name: Write release proof summary
        run: |
          VERSION=$(node -p "require('./release-artifact/release-manifest.json').version")
          INTEGRITY=$(node -p "require('./release-artifact/release-manifest.json').integrity")
          {
            echo "### npm publish proof"
            echo "- channel: ${{ needs.prepare.outputs.channel }}"
            echo "- version: $VERSION"
            echo "- source: $PUBLISH_REF@$PUBLISH_SHA"
            echo "- integrity: $INTEGRITY"
            echo "- workflow: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } >> "$GITHUB_STEP_SUMMARY"

  create-github-release:
    needs: [prepare, publish-stable]
    # !failure() && !cancelled() is required here too: success() is transitive
    # over the whole needs chain, so the deliberately skipped windows-consumer
    # (via publish-stable's needs) would otherwise skip this job — measured on
    # the v3.7.1 cut, where the tag published but no GitHub Release appeared.
    # publish-stable succeeding is the real gate, and it is a direct need.
    if: ${{ !failure() && !cancelled() && needs.prepare.outputs.channel == 'latest' && needs.prepare.outputs.should_publish == 'true' && needs.publish-stable.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.publish_sha || github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.node-version'
          registry-url: 'https://registry.npmjs.org'
      - name: Pin release npm
        run: |
          NPM_VERSION=$(node -p "require('./package.json').packageManager.split('@').pop()")
          npm install -g "npm@$NPM_VERSION"
          test "$(npm -v)" = "$NPM_VERSION"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-release-artifact
          path: release-artifact
      - name: Create or refresh GitHub Release with publish evidence
        run: >-
          node scripts/release-contract.mjs ensure-github-release
          "${{ needs.prepare.outputs.version }}"
          "$PUBLISH_SHA"
          release-artifact
      - name: Attest the tested release artifact
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            release-artifact/*.tgz
            release-artifact/release-manifest.json
            release-artifact/sbom.cdx.json
      - name: Write GitHub Release proof summary
        run: |
          {
            echo "### GitHub Release proof"
            echo "- tag: v${{ needs.prepare.outputs.version }}"
            echo "- source: $PUBLISH_REF@$PUBLISH_SHA"
            echo "- workflow: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } >> "$GITHUB_STEP_SUMMARY"
