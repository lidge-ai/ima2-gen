<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face { font-family: Clash; src: url("../../../../ui/public/fonts/ClashDisplay-700.woff2") format("woff2"); font-weight: 700; }
@font-face { font-family: Satoshi; src: url("../../../../ui/public/fonts/Satoshi-500.woff2") format("woff2"); font-weight: 500; }
@font-face { font-family: Plex; src: url("../../../../ui/public/fonts/IBMPlexMono-400.woff2") format("woff2"); font-weight: 400; }
* { margin: 0; box-sizing: border-box; }
html, body { width: 1280px; height: 400px; background: transparent; overflow: hidden; }
.stage { position: relative; width: 1280px; height: 400px; border-radius: 18px; overflow: hidden;
  background:
    radial-gradient(520px 320px at 300px 200px, rgba(255,255,255,.09), transparent 70%),
    radial-gradient(900px 400px at 900px 520px, rgba(255,255,255,.035), transparent 70%),
    linear-gradient(180deg, #0d0d10 0%, #070708 100%);
  display: flex; align-items: center; padding: 0 120px 0 150px; gap: 72px; }
.stage::after { content: ""; position: absolute; inset: 0; border-bottom: 1px solid rgba(255,255,255,.06);
  background-image: radial-gradient(rgba(255,255,255,.05) 1px, transparent 1px); background-size: 24px 24px;
  mask-image: linear-gradient(90deg, transparent 30%, #000 75%); pointer-events: none; }
.mark { height: 260px; filter: drop-shadow(0 30px 40px rgba(0,0,0,.6)); position: relative; z-index: 1; }
.copy { position: relative; z-index: 1; display: flex; flex-direction: column; }
.word { font-family: Clash; font-weight: 700; font-size: 168px; line-height: .86; letter-spacing: -2px;
  background: linear-gradient(180deg, #ffffff 0%, #d9d9de 38%, #7c7c85 62%, #e9e9ee 78%, #9a9aa2 100%);
  -webkit-background-clip: text; background-clip: text; color: transparent; }
.tag { font-family: Satoshi; font-weight: 500; font-size: 27px; color: #d4d4d8; margin-top: 26px; letter-spacing: -.2px; }
.lanes { font-family: Plex; font-size: 15px; color: #71717a; margin-top: 16px; letter-spacing: .6px; text-transform: uppercase; }
.lanes b { color: #a1a1aa; font-weight: 400; }
</style></head>
<body><div class="stage">
  <img class="mark" src="../../../../assets/brand/mark-chrome.png" alt="">
  <div class="copy">
    <div class="word">ima2</div>
    <div class="tag">Local image &amp; video studio for people and coding agents</div>
    <div class="lanes"><b>GPT</b> · <b>Grok</b> · <b>Gemini</b> · <b>NovelAI</b> · <b>ComfyUI</b> · on your machine</div>
  </div>
</div></body></html>
