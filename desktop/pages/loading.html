<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; img-src 'self' file:; script-src 'self'" />
  <title>ima2</title>
  <link rel="stylesheet" href="desktop.css" />
  <link rel="stylesheet" href="loading.css" />
</head>
<body>
  <div class="drag" aria-hidden="true"></div>
  <main class="boot">
    <img class="boot__mark" src="brand-mark.png" alt="" />
    <h1 class="boot__word">ima2</h1>
    <p class="boot__tag" id="tag" role="status" aria-live="polite">Starting your local studio</p>
    <ol class="boot__steps">
      <li id="row-server" data-state="active"><span class="ic" aria-hidden="true"></span><span class="t">Local server</span><span class="d"></span></li>
      <li id="row-open" data-state="wait"><span class="ic" aria-hidden="true"></span><span class="t">Open workspace</span><span class="d"></span></li>
    </ol>
    <div id="error" class="error-box" hidden></div>
    <div class="actions" id="actions" hidden>
      <button id="restart" class="primary">Restart Server</button>
      <button id="logs">Open Server Log</button>
      <button id="settings">Settings…</button>
    </div>
  </main>
  <footer class="boot__foot" id="foot"></footer>
  <script src="loading.js"></script>
</body>
</html>
