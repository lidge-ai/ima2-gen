# Two-package layout: this directory is the dev package (Electron toolchain),
# the repository root is the app package (server + production node_modules).
# Build:  npm run prepare:app && npm run dist   (from desktop/)
appId: com.lidge.ima2
productName: ima2
copyright: Copyright © 2026 lidge-jun
artifactName: ${productName}-${version}-${os}-${arch}.${ext}

directories:
  app: ..
  buildResources: build
  output: dist

extraMetadata:
  main: desktop/main.mjs

# Rebuild native modules (better-sqlite3 etc.) against Electron's ABI.
npmRebuild: true
nodeGypRebuild: false
buildDependenciesFromSource: false
# The server runs as a plain Node child process (ELECTRON_RUN_AS_NODE) with a
# real cwd and ESM imports, so the app tree must stay on disk, not in an asar.
asar: false

files:
  - package.json
  - server.js
  - config.js
  - bin/**/*.js
  - lib/**/*.js
  - routes/**/*.js
  - ui/dist/**
  - skills/**
  - vendor/**
  - assets/card-news/templates/**
  - assets/mcp-snapshots/**
  - desktop/main.mjs
  - desktop/preload.cjs
  - desktop/lib/**
  - desktop/pages/**
  - desktop/build/icon.png
  - desktop/build/tray*.png
  - "!desktop/node_modules"
  - "!desktop/dist"
  - "!ui/node_modules"
  - "!**/*.ts"
  - "!**/*.map"
  - "!**/*.tsbuildinfo"
  - "!node_modules/typescript/**"
  - "!node_modules/tsx/**"
  - "!node_modules/node-gyp/**"
  - "!node_modules/@types/**"

# Runs before electron-builder signs the bundle, awaiting its imported keychain
# before resolving the sidecar identity. With asar:false the whole
# production node_modules tree ships as loose files, and electron-builder does
# not sign Mach-O binaries it did not place there. Seven of them have no file
# extension (codex, rg, zsh, macos-trash, esbuild), so notarization rejects the
# upload unless they are signed here first.
afterPack: build/sign-extra-binaries.mjs

publish: null

mac:
  category: public.app-category.graphics-design
  icon: build/icon.png
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # PR previews explicitly disable signing/notarization. Trusted CI requires
  # forceCodeSigning, distribution signing and notarization, then verifies both
  # architecture installers. Local builds retain the explicit notarize opt-in.
  # Required CI signing inputs:
  #   CSC_LINK, CSC_KEY_PASSWORD (Developer ID Application .p12)
  #   APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID  (notarytool)
  notarize: false
  extendInfo:
    LSUIElement: false
    NSCameraUsageDescription: ima2 does not use the camera.

dmg:
  contents:
    - { x: 130, y: 220 }
    - { x: 410, y: 220, type: link, path: /Applications }

win:
  icon: build/icon.png
  target:
    - target: nsis
      arch: [x64, arm64]
    - target: zip
      arch: [x64]
  # Authenticode signing: set WIN_CSC_LINK / WIN_CSC_KEY_PASSWORD in CI.

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  shortcutName: ima2
  deleteAppDataOnUninstall: false

linux:
  icon: build/icon.png
  category: Graphics
  synopsis: Local-first visual generation studio
  maintainer: lidge-jun
  target:
    - target: AppImage
      arch: [x64, arm64]
    - target: deb
      arch: [x64, arm64]
